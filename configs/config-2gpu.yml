network:
  host: 0.0.0.0
  port: 8001
  disable_auth: false
  allowed_origins: ["*"]
  disable_fetch_requests: false
  send_tracebacks: false
  api_servers: ["OAI"]
  sse_ping_interval: 15
  access_log: false

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
  log_live_status: true
  log_timestamps: true
  log_chat_completion_requests: false

model:
  model_dir: models
  inline_model_loading: false
  use_dummy_models: false
  dummy_model_names: ["gpt-3.5-turbo"]
  model_name: Qwen3.8-Flash-Next-EXL3-405
  use_as_default: []
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 262144
  cache_mode: 6,6
  tensor_parallel: false
  tensor_parallel_backend: native
  gpu_split_auto: true
  # 96 MB per card — DO NOT raise to 1024: exllamav3 1.5.x budgets each MoE layer's
  # worst-case prefill transient (~700-750 MiB on this layout) inside the device
  # budget, and a 1 GB reserve failed the 2-GPU load with "Insufficient VRAM in split
  # for model and cache" on the engines this layout was tuned on. 1.5.2/1.5.3 reworked
  # that accounting; 96 MB stays the verified value (loads in ~33 s).
  autosplit_reserve: [96.0, 96.0]
  gpu_split: []
  cpu_moe_offload_layers: 0
  cpu_moe_split_experts: 416
  cpu_moe_threads: 16
  ngram_ram: true
  rope_scale: 1.0
  rope_alpha:
  chunk_size: 2048
  output_chunking: true
  max_batch_size:
  prompt_template: froggeric-qwen38-v225
  vision: false
  vision_offload: false
  template_vars_default: {enable_thinking: true, preserve_reasoning: true, reasoning_effort: xhigh}
  template_vars_force: {}
  force_enable_thinking: false
  reasoning: true
  reasoning_start_token: <think>
  reasoning_end_token: </think>
  start_in_reasoning: auto
  tool_calls_in_reasoning: true
  reasoning_budget_tokens:
  reasoning_budget_message:
  tool_format: qwen3_coder
  harmony:
  muse_glimmer:

draft_model:
  draft_mode: mtp
  draft_model_dir: models
  draft_model_name:
  draft_rope_scale: 1.0
  draft_rope_alpha:
  draft_cache_mode: Q6
  draft_gpu_split: []
  draft_num_tokens: 8
  dynamic_draft: true
  ngram_match_min: 2

lora:
  lora_dir: loras
  loras:

embeddings:
  embedding_model_dir: models
  embeddings_device: cpu
  embedding_model_name:

sampling:
  override_preset: qwen38_flash_next_thinking

memory:
  sysmem_recurrent_cache: 4096
  sysmem_kv_cache: 0
  sysmem_multimodal_cache: 1024
  cuda_malloc_async: false

developer:
  unsafe_launch: false
  disable_request_streaming: false
  realtime_process_priority: false
  seqlog: false
  seqlog_server_url: http://localhost:5341
  seqlog_api_key:
